# Sysadmin-owned model policy.
#
# This file maps logical tier x role constants to concrete catalog
# entries addressed as `driverId:modelId`. Driver catalogs under
# `catalogs/` say what a vendor serves; this file says what we choose.
#
# Environment overrides, highest precedence first:
#   THREADBOX_FORCE_MODEL      pin one catalog reference for every role
#   THREADBOX_ROLE_<ROLE>      pin one catalog reference for one role
#   THREADBOX_TIER             select the tier (alias THREADBOX_PROFILE)
#
# The allowedCostClasses gate is applied after every override, so an
# override cannot spend premium budget under eco or balanced.
version: 1
defaultTier: eco

tiers:
  eco:
    allowedCostClasses: [free, low]
    plan: opencode-go:qwen-code
    code: opencode-go:qwen-code
    review: opencode-go:kimi-code
    summarize: ollama:gemma4

  balanced:
    allowedCostClasses: [free, low, standard]
    plan: opencode-zen:sonnet-balanced
    code: opencode-zen:gpt-terra
    review: opencode-go:qwen-code
    summarize: groq:fast

  performance:
    allowedCostClasses: [free, low, standard, premium]
    plan: opencode-zen:opus-performance
    code: opencode-zen:gpt-sol
    review: opencode-zen:opus-performance
    summarize: groq:strong
