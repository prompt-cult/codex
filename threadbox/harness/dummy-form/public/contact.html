<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dummy CRM — Contact</title>
</head>
<body>
  <h1 id="contact-name">Loading…</h1>
  <p>Address: <span id="contact-address"></span></p>
  <button id="edit">Edit</button>
  <div id="edit-form" hidden>
    <input id="address-input">
    <button id="save">Save</button>
  </div>
  <div id="confirm-banner" hidden>Contact saved</div>

  <script>
    function postAction(action) {
      fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(action) });
    }

    const id = parseInt(new URLSearchParams(window.location.search).get('id'), 10);
    let contact = null;

    async function load() {
      const res = await fetch('/contact/' + id);
      contact = await res.json();
      document.getElementById('contact-name').textContent = contact.name;
      document.getElementById('contact-address').textContent = contact.address;
    }

    document.getElementById('edit').addEventListener('click', () => {
      postAction({ action: 'edit', id });
      document.getElementById('edit-form').hidden = false;
      document.getElementById('address-input').value = contact.address;
      document.getElementById('confirm-banner').hidden = true;
    });

    document.getElementById('save').addEventListener('click', async () => {
      const address = document.getElementById('address-input').value;
      postAction({ action: 'save', id, address });
      await fetch('/contact/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, address }),
      });
      document.getElementById('contact-address').textContent = address;
      document.getElementById('edit-form').hidden = true;
      document.getElementById('confirm-banner').hidden = false;
    });

    load();
  </script>
</body>
</html>
