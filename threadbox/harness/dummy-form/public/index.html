<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dummy CRM — Contacts</title>
</head>
<body>
  <h1>Contacts</h1>
  <input id="search" placeholder="Search contacts...">
  <table id="contacts-table">
    <tbody id="contacts-body"></tbody>
  </table>

  <script>
    function postAction(action) {
      fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(action) });
    }

    function render(contacts) {
      const body = document.getElementById('contacts-body');
      body.innerHTML = '';
      for (const c of contacts) {
        const row = document.createElement('tr');
        row.setAttribute('data-id', c.id);
        row.setAttribute('data-name', c.name);
        row.textContent = c.name;
        row.addEventListener('click', () => {
          postAction({ action: 'click-row', id: c.id, name: c.name });
          window.location.href = '/contact.html?id=' + c.id;
        });
        body.appendChild(row);
      }
    }

    async function search(query) {
      const res = await fetch('/contacts.json?q=' + encodeURIComponent(query));
      const contacts = await res.json();
      render(contacts);
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const query = e.target.value;
      postAction({ action: 'search', query });
      search(query);
    });

    search('');
  </script>
</body>
</html>
