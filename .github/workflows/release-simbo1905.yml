name: release-simbo1905
on:
  push:
    tags:
      - '202[0-9].*'

jobs:
  test:
    name: Run Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          cache-on-failure: "true"
      - name: Run cargo test
        run: cargo test -p codex-tui

  build:
    needs: test
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      # thin LTO: much faster link than fat, still optimised
      CARGO_PROFILE_RELEASE_LTO: thin
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            asset_name: codex-macos-arm64
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404
            asset_name: codex-linux-x64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          # separate cache per target triple
          shared-key: release-${{ matrix.target }}
          cache-on-failure: "true"

      - if: runner.os == 'Linux'
        name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcap-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --bin codex

      - name: Prepare assets
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/codex dist/${{ matrix.asset_name }}
          cd dist
          tar -czf ../${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: codex-rs/${{ matrix.asset_name }}.tar.gz

  release:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          find . -maxdepth 1 -name "README.*.md" -exec cp {} dist/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
