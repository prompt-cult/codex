name: release-simbo1905
on:
  push:
    tags:
      - '202[0-9].*'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test

  build:
    needs: test
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-arm64
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_musl: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add cross target to pinned toolchain
        run: rustup target add ${{ matrix.target }} --toolchain 1.93.0
      - if: runner.os == 'Linux'
        name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-linux-musl-gcc || true
      - name: Build proxies
        run: cargo build --release --target ${{ matrix.target }} --bin codex-mistral-proxy --bin codex-opencode-proxy
      - name: Package
        working-directory: .
        run: |
          mkdir -p dist
          cp codex-rs/target/${{ matrix.target }}/release/codex-mistral-proxy dist/codex-mistral-proxy-${{ matrix.platform }}
          cp codex-rs/target/${{ matrix.target }}/release/codex-opencode-proxy dist/codex-opencode-proxy-${{ matrix.platform }}
          tar -czf codex-proxies-${{ matrix.platform }}.tar.gz -C dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxies-${{ matrix.platform }}
          path: codex-proxies-${{ matrix.platform }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: find artifacts -name "*.tar.gz" -exec mv {} . \;
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: 'Just the secure translating proxies: codex-mistral-proxy and codex-opencode-proxy.'
          generate_release_notes: false
          files: codex-proxies-*.tar.gz
